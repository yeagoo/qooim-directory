# Optional localhost-only HTTPS demo. Production uses your own TLS reverse proxy.
services:
  proxy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    entrypoint: [sh, /etc/caddy/start-demo-proxy.sh]
    environment:
      PROXY_TRUST_TOKEN: ${PROXY_TRUST_TOKEN:-}
      DEMO_TLS_PORT: ${DEMO_TLS_PORT:-8443}
    ports: ["127.0.0.1:${DEMO_TLS_PORT:-8443}:${DEMO_TLS_PORT:-8443}"]
    volumes:
      - ./deploy/Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - ./deploy/start-demo-proxy.sh:/etc/caddy/start-demo-proxy.sh:ro
      - demo_tls:/data
      - demo_trust:/trust
    networks:
      default:
        aliases:
          [admin.localhost, atlas.localhost, notes.localhost, library.localhost]
    healthcheck:
      test: [CMD-SHELL, test -s /trust/root.crt]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  init:
    depends_on:
      proxy: { condition: service_healthy }
  web:
    environment:
      NODE_EXTRA_CA_CERTS: /trust/root.crt
    volumes: [demo_trust:/trust:ro]
  worker:
    environment:
      NODE_EXTRA_CA_CERTS: /trust/root.crt
    volumes: [demo_trust:/trust:ro]
volumes:
  demo_tls:
  demo_trust:
