name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-release:
    # The product is pinned to linux/arm64; native Next/SWC and esbuild
    # optional dependencies cannot build on an x64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, so release:check can compare a release tag with package.json.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:release
      - run: pnpm release:check

  # Integration suites need a self-hosted arm64 runner labeled linux, arm64 and
  # qooim-directory, with Docker, passwordless sudo (test hosts entries) and the
  # Playwright browser dependencies. Pull requests from forks never reach it.
  arm64-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, qooim-directory]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      # Suites share the test hosts entries and a database: run them one at a time.
      - run: pnpm test:p1
      - run: pnpm test:p2
      - run: pnpm test:p17
      - run: pnpm test:p20

  arm64-full:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, arm64, qooim-directory]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:p0
      - run: pnpm test:p1
      - run: pnpm test:p2
      - run: pnpm test:p3
      - run: pnpm test:p4
      - run: pnpm test:p5
      - run: pnpm test:p6
      - run: pnpm test:p7
      - run: pnpm test:p8
      - run: pnpm test:p9
      - run: pnpm test:p10
      - run: pnpm test:p11
      - run: pnpm test:p12
      - run: pnpm test:p13
      - run: pnpm test:p14
      - run: pnpm test:p15
      - run: pnpm test:p16
      - run: pnpm test:p17
      - run: pnpm test:p20
      - run: pnpm release:check

  docker-acceptance:
    # Builds the image and runs the Compose acceptance (empty database, three sites,
    # HTTPS login, restarts, recovery). Manual: it takes the runner for a while.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, arm64, qooim-directory]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:docker
      - run: pnpm release:check:image
